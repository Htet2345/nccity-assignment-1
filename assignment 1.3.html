<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #344d63;
      color: #aaa6a7;
      font-family: "Arial Narrow", Arial, sans-serif;
    }

    .services {
      width: 782px;
      max-width: calc(100% - 32px);
      margin: 43px auto;
    }

    h1 {
      margin: 0;
      padding-bottom: 2px;
      border-bottom: 2px solid #20d479;
      text-align: center;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 52px;
      font-weight: 400;
      line-height: 50px;
      letter-spacing: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 184px);
      gap: 49px 20px;
      margin-top: 40px;
    }

    .service-card {
      height: 111px;
      border: 1px solid #20d479;
      text-align: center;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 51px;
      height: 51px;
      margin: 14px auto 6px;
      border-radius: 50%;
      background: #25d078;
      color: #243e51;
    }

    .icon svg { width: 24px; height: 24px; fill: currentColor; }

    .service-card h2 {
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: .15px;
    }

    @media (max-width: 820px) {
      .services { width: 592px; }
      .grid { grid-template-columns: repeat(3, 184px); }
    }

    @media (max-width: 620px) {
      .services { width: 388px; }
      .grid { grid-template-columns: repeat(2, minmax(140px, 184px)); }
    }
  </style>
</head>
<body>
  <main class="services">
    <h1>SERVICES</h1>
    <section class="grid">
      <article class="service-card">
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 15.4c.9.9.9 2.4 0 3.3-1.7 1.7-4.9 1.6-6.2 1.5 0-1.3-.2-4.5 1.5-6.2.9-.9 2.4-.9 3.3 0l1.4 1.4zm15.5-13c-.8-.8-2-.8-2.8 0L8 14.3l2.8 2.8L22.7 5.2c.8-.8.8-2 0-2.8z"/></svg>
        </div>
        <h2>Graphic Design</h2>
      </article>

      <article class="service-card">
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h20v15h-8v2h4v2H6v-2h4v-2H2V3zm2 2v10h16V5H4z"/></svg>
        </div>
        <h2>Web Design</h2>
      </article>

      <article class="service-card">
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 16.6 4.1 12l4.6-4.6L7.3 6l-6 6 6 6 1.4-1.4zm6.6 0 4.6-4.6-4.6-4.6L16.7 6l6 6-6 6-1.4-1.4zM9.2 20l3.7-16h2L11.2 20h-2z"/></svg>
        </div>
        <h2>Web Development</h2>
      </article>

      <article class="service-card">
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v5H3V3zm3 2v1h2V5H6zm-3 5h18v5H3v-5zm3 2v1h2v-1H6zm-3 5h18v5H3v-5zm3 2v1h2v-1H6zm7-14h5v1h-5V5zm0 7h5v1h-5v-1zm0 7h5v1h-5v-1z"/></svg>
        </div>
        <h2>Hosting</h2>
      </article>

      <article class="service-card">
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 0-4.2 12.6L3 18.4 4.6 20l2.8-2.8A7 7 0 0 0 17 10h-2a5 5 0 1 1-5-5V3zm1 2h2v6h-2V5zm1 7.5 5.6 5.6-1.5 1.5-5.6-5.6 1.5-1.5z"/></svg>
        </div>
        <h2>SEO Optimization</h2>
      </article>

      <article class="service-card">
        <div class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 1h12a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm1 3v14h10V4H7zm4 16v1h2v-1h-2z"/></svg>
        </div>
        <h2>Responsive Design</h2>
      </article>
    </section>
  </main>
</body>
</html>
