<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      color: #303ede;
    }

    .login-card {
      position: relative;
      width: 300px;
      margin: 99px auto 0;
      padding: 31px 20px 21px;
      border: 1px solid #eee8d8;
      border-radius: 5px;
      background: #f5f5f5;
      box-shadow: 0 1px 7px rgba(0, 0, 0, .02);
    }

    .avatar {
      position: absolute;
      top: -60px;
      left: 50%;
      width: 87px;
      height: 87px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #e7edfb;
      overflow: hidden;
    }

    .avatar svg { display: block; width: 100%; height: 100%; }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 16px;
      line-height: 18px;
    }

    input {
      display: block;
      width: 100%;
      height: 32px;
      margin-bottom: 15px;
      padding: 3px 6px;
      border: 2px solid #858585;
      border-radius: 5px;
      background: #fff;
      color: #222;
      font-size: 16px;
      outline: none;
    }

    input::placeholder { color: #7474ef; opacity: 1; }
    input:focus { border-color: #303ede; }

    button {
      width: 100%;
      height: 40px;
      margin-top: 10px;
      border: 0;
      border-radius: 4px;
      background: #0808f5;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #0000d5; }
  </style>
</head>
<body>
  <form class="login-card">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="34" r="20" fill="#3c94f2"/>
        <path d="M10 88c5-23 20-35 40-35s35 12 40 35c-11 9-24 13-40 13S21 97 10 88z" fill="#3c94f2"/>
      </svg>
    </div>

    <label for="login-email">Email</label>
    <input id="login-email" type="email" placeholder="Enter your Email">

    <label for="login-password">Password</label>
    <input id="login-password" type="password" placeholder="Enter your password">

    <button type="submit">Login</button>
  </form>
</body>
</html>
